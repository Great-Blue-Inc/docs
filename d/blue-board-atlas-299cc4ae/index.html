/* Single visual world: an isometric night map. Every color painted explicitly. */
:root{
  --bg:#080D16;
  --bg2:#0B1220;
  --grid:#141F31;
  --panel:#0D1524;
  --panel-edge:#1D2B42;
  --chipbg:#111C2E;
  --ink:#E6EEF8;
  --ink-soft:#9AACC2;
  --ink-faint:#5A6E88;
  --accent:#5FA8F0;
  --accent-soft:#12283F;
  --reads:#4E9EE8;
  --writes:#E8933F;
  --calls:#A78BFA;
  --ext:#3ECFA5;
  --glowring:#7FC0FF;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Instrument Sans',sans-serif;overflow:hidden;height:100vh}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#topbar{position:fixed;inset:0 0 auto 0;height:54px;display:flex;align-items:center;gap:16px;
  padding:0 18px;background:rgba(8,13,22,.88);backdrop-filter:blur(6px);border-bottom:1px solid var(--panel-edge);z-index:40}
.brand{font-family:'Barlow Condensed';font-weight:600;font-size:20px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
.brand .thin{color:var(--accent)}
.livechip{display:flex;align-items:center;gap:6px;font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.08em;
  color:#8FE6B8;background:#0D2118;border:1px solid #1E4A34;border-radius:4px;padding:3px 8px;white-space:nowrap}
.livechip .dot{width:6px;height:6px;border-radius:50%;background:#4ADE80;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.commit{font-family:'IBM Plex Mono';font-size:11px;color:var(--ink-soft);background:var(--chipbg);
  border:1px solid var(--panel-edge);border-radius:4px;padding:3px 8px;white-space:nowrap}
#stats{display:flex;gap:14px;margin-left:auto;font-family:'IBM Plex Mono';font-size:11px;color:var(--ink-soft);white-space:nowrap}
#stats b{color:var(--ink);font-weight:500}
#zoomctl{display:flex;gap:2px;border:1px solid var(--panel-edge);border-radius:6px;overflow:hidden}
#zoomctl button{padding:4px 10px;font-size:13px;color:var(--ink-soft);background:var(--chipbg)}
#zoomctl button:hover{color:var(--ink);background:var(--accent-soft)}

#pathbar{position:fixed;top:54px;left:0;right:392px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  padding:8px 18px 10px;z-index:35;background:linear-gradient(180deg,rgba(8,13,22,.85),rgba(8,13,22,0));pointer-events:none}
#pathbar .lbl{font-family:'Barlow Condensed';font-weight:600;font-size:12px;letter-spacing:.26em;
  text-transform:uppercase;color:var(--ink-faint);white-space:nowrap}
#pathbar .jchip{pointer-events:auto;font-family:'IBM Plex Mono';font-size:11px;color:var(--ink-soft);

res planned hours against actuals per member and client. Actuals roll up inside Postgres in a single function call instead of N queries.","hops":[{"node":"src/app/(app)/capacity/page.tsx","label":"Capacity page: plans vs actuals per member and client"},{"node":"rpc:monthly_hours_by_member_client","label":"Actual hours roll up in one Postgres function"},{"node":"table:capacity_plans","label":"Planned hours per member live here"}]},{"id":"monthly-invoices","name":"Monthly invoice run","summary":"An admin triggers the monthly run; one Postgres function turns unbilled time into draft invoices. Drafts get reviewed, then finalize-and-send delivers each client a tokenized link.","hops":[{"node":"src/app/(app)/(accounting)/accounting/invoices/actions.ts","label":"Admin triggers the monthly generation run"},{"node":"rpc:generate_monthly_invoices","label":"One Postgres function turns unbilled time into draft invoices"},{"node":"table:invoices","label":"Drafts land here for review"},{"node":"src/app/(app)/(accounting)/accounting/invoices/send-actions.ts","label":"Finalize + send delivers the tokenized invoice link"}]},{"id":"dunning","name":"Nightly dunning run","summary":"Every night Vercel fires the dunning cron. It authenticates with CRON_SECRET, evaluates every open finalized invoice against its customer's reminder schedule, sends one consolidated email per customer through Resend, and records the send so re-runs are idempotent.","hops":[{"node":"cron:/api/cron/dunning","label":"Vercel cron fires on schedule"},{"node":"src/app/api/cron/dunning/route.ts","label":"Route authenticates the Bearer CRON_SECRET, loads open finalized invoices with their customers"},{"node":"table:invoices","label":"Reads invoices (status=finalized, not voided) joined to customers"},{"node":"src/lib/accounting/dunning.ts","label":"evaluateReminders() decides which reminder stage each invoice is due for today"},{"node":"src/lib/email.ts","label":"sendEmail() delivers one consolidated email per customer via Resend"},{"node":"table:invoice_emails","label":"Records each send; the (invoice, stage) unique constraint makes re-runs idempotent"}]},{"id":"fx","name":"Daily FX pull","summary":"A daily cron pulls CAD exchange rates from the Bank of Canada's public Valet API and stores them, so accounting can value multi-currency amounts without a paid FX provider.","hops":[{"node":"cron:/api/cron/fx-rates","label":"Vercel cron fires daily"},{"node":"src/app/api/cron/fx-rates/route.ts","label":"Fetches current rates from bankofcanada.ca Valet API"},{"node":"table:fx_rates","label":"Upserts the day's rates for use across accounting"}]},{"id":"invoice-view","name":"Client opens an invoice","summary":"Invoices are shared with clients as tokenized public URLs — no login required. The token route looks up the invoice, renders it, and the client can pay or query from there. This is the only unauthenticated app surface besides login.","hops":[{"node":"src/app/invoice/[token]/page.tsx","label":"Public tokenized route — the client needs no account"},{"node":"rpc:public_invoice_by_token","label":"A SECURITY DEFINER Postgres function resolves the token — the anonymous client never gets direct table access"},{"node":"table:invoices","label":"The function reads the invoice on the caller's behalf, RLS intact"}]},{"id":"journal","name":"Manual journal entry","summary":"The accounting journal is a real double-entry ledger. Manual entries go through a server action into a Postgres function that writes both sides atomically — the app can never record an unbalanced entry.","hops":[{"node":"src/app/(app)/(accounting)/accounting/journal/page.tsx","label":"Journal page shows the double-entry ledger"},{"node":"src/app/(app)/(accounting)/accounting/journal/actions.ts","label":"Manual entries go through server actions"},{"node":"rpc:create_manual_journal_entry","label":"A Postgres function writes debit and credit sides atomically"},{"node":"table:journal_entries","label":"Balanced entries land here, lines in journal_lines"}]},{"id":"banking","name":"Bank reconciliation","summary":"Bank statements import as CSV lines, each line gets matched to payments or expenses through Postgres functions, and a reconciliation record closes the period.","hops":[{"node":"src/app/(app)/(accounting)/accounting/banking/actions.ts","label":"Statement import and matching are server actions"},{"node":"rpc:import_bank_statement_lines","label":"CSV lines import in one function call"},{"node":"table:bank_statement_lines","label":"Imported lines wait here for matching"},{"node":"rpc:match_statement_line","label":"Each match posts through a function"},{"node":"table:bank_reconciliations","label":"The reconciliation record closes the loop"}]},{"id":"team","name":"Team & cost rates","summary":"Admins manage members and their cost rates. The team page reads recent hours per member; role and rate changes are admin-gated server actions, and cost rates feed margin math downstream.","hops":[{"node":"src/app/(app)/(admin)/team/page.tsx","label":"Team page: members and recent workload"},{"node":"table:time_entries","label":"Reads recent hours per member"},{"node":"src/app/(app)/(admin)/team/actions.ts","label":"Role and rate changes are admin server actions"},{"node":"table:user_cost_rates","label":"Cost rates power margin math downstream"}]},{"id":"reports","name":"Building a report","summary":"The report builder saves report definitions and renders them by flattening and sorting the dataset in shared lib code rather than ad-hoc queries per page.","hops":[{"node":"src/app/(app)/(admin)/reports/page.tsx","label":"Report builder page"},{"node":"src/lib/report-flatten.ts","label":"lib/report-* flattens and sorts the dataset"},{"node":"table:reports","label":"Saved report definitions"}]},{"id":"attachment","name":"Serving an attachment","summary":"Task attachments never expose storage URLs directly. An authenticated route looks up the storage path, then streams the object through a short-lived signed URL.","hops":[{"node":"src/app/(app)/attachments/[id]/route.ts","label":"Authenticated route — storage is never linked directly"},{"node":"table:task_attachments","label":"Looks up storage path and content type, then streams via a short-lived signed URL"}]}]}</script>
<script>
const M = JSON.parse(document.getElementById('mapdata').textContent);
const $=(s,el=document)=>el.querySelector(s);
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const gh=(path,line)=>`${M.github}/blob/${M.commit}/${path}`+(line?`#L${line}`:'');
const ghCite=c=>{const i=c.lastIndexOf(':');return gh(c.slice(0,i),c.slice(i+1))};
const NS='http://www.w3.org/2000/svg';
const svgel=(t,attrs)=>{const e=document.createElementNS(NS,t);for(const k in attrs)e.setAttribute(k,attrs[k]);return e};

/* ---------- color utils ---------- */
/* darken mixes toward night-blue (atmosphere), lighten toward warm white — never flat black/white */
const NIGHT=[10,19,34], WARM=[248,250,255];
function shade(hex,f){
  const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;
  if(f>=1){const t=Math.min(1,f-1);r+=(WARM[0]-r)*t;g+=(WARM[1]-g)*t;b+=(WARM[2]-b)*t}
  else{const t=1-f;r+=(NIGHT[0]-r)*t;g+=(NIGHT[1]-g)*t;b+=(NIGHT[2]-b)*t}
  return `rgb(${r|0},${g|0},${b|0})`;
}
/* harmonized night palette — one saturation band, gold reserved for the biggest system */
const TINT={auth:'#7C8AF5',projects:'#45B8E8',time:'#43D9A3',accounting:'#F0B650',
  invoicing:'#F27D9D',dashboard:'#B08CF7',admin:'#8FA6BF',attachments:'#4DD3C6',platform:'#6E87A8'};

/* ---------- isometric projection ---------- */
const C30=0.866,S30=0.5;
const OX=1350,OY=560; // world origin on canvas
const P=(x,y,z=0)=>[OX+(x-y)*C30, OY+(x+y)*S30-z];
const poly=(pts,fill,extra)=>svgel('polygon',{points:pts.map(p=>p.join(',')).join(' '),fill,...(extra||{})});

const iso=$('#iso'), labels=$('#labels'), fx=$('#fx'), ctx=fx.getContext('2d');
const defs=svgel('defs',{});
defs.innerHTML='<filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>'
  +'<radialGradient id="pool"><stop offset="0%" stop-color="#16273F" stop-opacity=".55"/><stop offset="100%" stop-color="#16273F" stop-opacity="0"/></radialGradient>';
const gGround=svgel('g',{}), gEdges=svgel('g',{}), gBld=svgel('g',{});
iso.append(defs,gGround,gEdges,gBld);

/* ---------- ground: iso grid + zone plates + etched labels ---------- */
{
  // glow pool under the city center anchors the composition
  const [px,py]=P(140,120);
  gGround.append(svgel('ellipse',{cx:px,cy:py,rx:900,ry:460,fill:'url(#pool)'}));
  const gridg=svgel('g',{stroke:'#0F1929','stroke-width':1});
  for(let i=-10;i<=15;i++){
    const a=P(i*90,-820),b=P(i*90,1360); gridg.append(svgel('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1]}));
  }
  for(let i=-10;i<=16;i++){
    const c=P(-880,i*90),d=P(1300,i*90); gridg.append(svgel('line',{x1:c[0],y1:c[1],x2:d[0],y2:d[1]}));
  }
  gGround.append(gridg);
  const plate=(x0,y0,x1,y1,fill)=>gGround.append(poly([P(x0,y0),P(x1,y0),P(x1,y1),P(x0,y1)],fill,
    {stroke:'#1B2A44','stroke-width':1}));
  plate(-620,-620,560,-420,'rgba(21,32,52,.35)');    // entry shelf
  plate(-700,560,1120,860,'rgba(26,36,62,.6)');      // data bedrock
  plate(-160,1040,880,1220,'rgba(17,26,43,.4)');     // external shelf
  // ground-plane text: basis vectors (0.866,0.5) and (-0.866,0.5)
  const etch=(txt,x,y,size)=>{const [sx,sy]=P(x,y);
    const t=svgel('text',{x:0,y:0,class:'zonetext','font-size':size||26,
      transform:`matrix(${C30},${S30},${-C30},${S30},${sx},${sy})`});
    t.textContent=txt; gGround.append(t)};
  /* zone text lives in verified-empty ground — an object may never cover ANY text */
  etch('ENTRY EDGE',-460,-560,30);        // north edge of entry shelf; kiosks start y=-540
  etch('APPLICATION',-1010,320,34);       // west margin, x <= -600, no object footprint reaches
  etch('DATA · SUPABASE POSTGRES · RLS',-780,620,24); // north of bedrock; slabs start y=660
  etch('EXTERNAL',-380,1100,28);          // west of external row; objects start x=-84
}

/* ---------- world layout ---------- */
const nodePos={};   // anchor id -> screen [x,y] (base center, for edges/journeys)
const sysDrawn={};  // sys id -> svg group

/* building: footprint w×d at (x,y), height h, tint */
/* ============ isometric primitive kit ============ */
/* Every landmark is composed from these. All draw into a passed group so
   composites stay one .bld unit for hover/dim/select. */
const RX=1.2247,RY=0.7071; // horizontal circle -> screen ellipse factors

function shadowIn(g,x,y,w,d){
  g.append(poly([P(x+8,y+8),P(x+w+26,y+8),P(x+w+26,y+d+26),P(x+8,y+d+26)],
    'rgba(3,7,14,.5)',{filter:'url(#soft)'}));
}
function boxIn(g,x,y,w,d,z0,h,tint,opts={}){
  const zt=z0+h;
  const B=P(x+w,y,z0),C=P(x+w,y+d,z0),D=P(x,y+d,z0);
  const At=P(x,y,zt),Bt=P(x+w,y,zt),Ct=P(x+w,y+d,zt),Dt=P(x,y+d,zt);
  const F=opts.dim?{l:.34,r:.46,t:.66,s:.9}:(opts.F||{l:.44,r:.66,t:1.14,s:1.42});
  if(opts.stroke){ // wireframe frame floor (construction)
    const s={fill:'none',stroke:shade(tint,1.2),'stroke-width':1,opacity:.7};
    g.append(poly([D,C,Ct,Dt],'none',s));g.append(poly([B,C,Ct,Bt],'none',s));
    g.append(poly([At,Bt,Ct,Dt],'none',s));return;
  }
  g.append(poly([D,C,Ct,Dt],shade(tint,F.l)));
  g.append(poly([B,C,Ct,Bt],shade(tint,F.r)));
  g.append(poly([At,Bt,Ct,Dt],shade(tint,F.t),{stroke:shade(tint,F.s),'stroke-width':1}));
  g.append(svgel('line',{x1:C[0],y1:C[1],x2:Ct[0],y2:Ct[1],stroke:shade(tint,1.35),'stroke-width':1.1,opacity:.8}));
  if(opts.windows){
    const rows=Math.max(1,Math.min(5,Math.floor(h/30))),cols=Math.max(2,Math.min(5,Math.floor(d/32)));
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      const lit=(r*7+c*3+((x|0)%11))%4; if(lit===0)continue;
      const wy=y+d*((c+0.28)/cols),wy2=y+d*((c+0.72)/cols);
      const wz=z0+h*((r+0.30)/rows),wz2=z0+h*((r+0.62)/rows);
      g.append(poly([P(x+w,wy,wz),P(x+w,wy2,wz),P(x+w,wy2,wz2),P(x+w,wy,wz2)],
        `rgba(255,216,143,${lit===1?.28:.6})`));
    }
  }
}
function cylIn(g,cx,cy,z0,r,h,tint,F){
  F=F||{side:.6,top:1.14};
  const [sx0,sy0]=P(cx,cy,z0),[sx1,sy1]=P(cx,cy,z0+h);
  const rx=r*RX,ry=r*RY;
  g.append(svgel('path',{d:`M${sx0-rx} ${sy0} A${rx} ${ry} 0 0 0 ${sx0+rx} ${sy0} L${sx1+rx} ${sy1} A${rx} ${ry} 0 0 1 ${sx1-rx} ${sy1} Z`,
    fill:shade(tint,F.side)}));
  g.append(svgel('path',{d:`M${sx0-rx} ${sy0} A${rx} ${ry} 0 0 0 ${sx0} ${sy0+ry*0.98} L${sx1} ${sy1+ry*0.98} L${sx1-rx} ${sy1} Z`,
    fill:shade(tint,F.side*0.72)}));
  g.append(svgel('ellipse',{cx:sx1,cy:sy1,rx,ry,fill:shade(tint,F.top),stroke:shade(tint,F.top+0.25),'stroke-width':1}));
}
function domeIn(g,cx,cy,z0,r,tint){
  const [sx,sy]=P(cx,cy,z0);
  const rx=r*RX,ry=r*RY;
  g.append(svgel('path',{d:`M${sx-rx} ${sy} A${rx} ${rx*0.92} 0 0 1 ${sx+rx} ${sy} A${rx} ${ry} 0 0 1 ${sx-rx} ${sy} Z`,
    fill:shade(tint,1.05),stroke:shade(tint,1.3),'stroke-width':1}));
  g.append(svgel('path',{d:`M${sx-rx} ${sy} A${rx} ${rx*0.92} 0 0 1 ${sx-rx*0.1} ${sy-rx*0.9} A${rx*0.62} ${rx*0.9} 0 0 0 ${sx-rx} ${sy} Z`,
    fill:shade(tint,.72)}));
}
function gableIn(g,x,y,w,d,z0,rh,tint){ // ridge along x at mid-depth
  const ym=y+d/2;
  g.append(poly([P(x,y+d,z0),P(x+w,y+d,z0),P(x+w,ym,z0+rh),P(x,ym,z0+rh)],shade(tint,.9)));
  g.append(poly([P(x+w,y+d,z0),P(x+w,y,z0),P(x+w,ym,z0+rh)],shade(tint,.6)));
  g.append(svgel('line',{...lxy(P(x,ym,z0+rh),P(x+w,ym,z0+rh)),stroke:shade(tint,1.35),'stroke-width':1}));
}
const lxy=(a,b)=>({x1:a[0],y1:a[1],x2:b[0],y2:b[1]});
function faceG(g,kind,px,py,pz){ // draw children in face-local coords: u along face, v up
  const [ox,oy]=P(px,py,pz);
  const m=kind==='south'?[C30,S30,0,-1]:kind==='east'?[-C30,S30,0,-1]:[C30,S30,-C30,S30];
  const fg=svgel('g',{transform:`matrix(${m[0]},${m[1]},${m[2]},${m[3]},${ox},${oy})`});
  g.append(fg);return fg;
}
function beaconIn(g,x,y,z,color){
  const [bx,by]=P(x,y,z);
  g.append(svgel('circle',{cx:bx,cy:by,r:9,fill:color,opacity:.16}));
  g.append(svgel('circle',{cx:bx,cy:by,r:3.2,fill:color}));
  g.append(svgel('line',{x1:bx,y1:by+4,x2:bx,y2:by+22,stroke:color,'stroke-width':1,opacity:.5}));
}
function bldGroup(id,x,y,w,d){
  const g=svgel('g',{class:'bld','data-id':id});
  shadowIn(g,x,y,w,d);
  gBld.append(g);
  const [ax,ay]=P(x+w/2,y+d,0);
  nodePos[id]=[ax,ay];
  return g;
}

/* ============ landmarks: a literal 3D object per node — no buildings ============ */
function gearD(R,teeth){
  let s='';
  for(let i=0;i<teeth;i++){
    const a0=(i/teeth)*Math.PI*2,a1=a0+Math.PI/teeth,r2=R*1.3;
    s+=`${i?'L':'M'}${R*Math.cos(a0)} ${R*Math.sin(a0)} L${r2*Math.cos(a0+0.1)} ${r2*Math.sin(a0+0.1)} L${r2*Math.cos(a1-0.1)} ${r2*Math.sin(a1-0.1)} L${R*Math.cos(a1)} ${R*Math.sin(a1)} `;
  }
  return s+'Z';
}
const LANDMARK={
  admin(g,x,y,w,d,h,t){ // a settings gear, extruded and lying on the ground
    const cx=x+w*0.48,cy=y+d*0.5,R=Math.min(w,d)*0.34;
    const fb=faceG(g,'top',cx,cy,6);
    fb.innerHTML=`<path d="${gearD(R,8)}" fill="${shade(t,.42)}"/>`;
    const ft=faceG(g,'top',cx,cy,22);
    ft.innerHTML=`<path d="${gearD(R,8)}" fill="${shade(t,1.1)}" stroke="${shade(t,1.35)}" stroke-width="1"/>`
      +`<circle r="${R*0.42}" fill="${shade(t,.4)}"/><circle r="${R*0.42}" fill="none" stroke="${shade(t,1.25)}" stroke-width="1"/>`;
    const f2b=faceG(g,'top',cx+R*1.6,cy-R*1.1,4);
    f2b.innerHTML=`<path d="${gearD(R*0.5,7)}" fill="${shade(t,.4)}"/>`;
    const f2t=faceG(g,'top',cx+R*1.6,cy-R*1.1,14);
    f2t.innerHTML=`<path d="${gearD(R*0.5,7)}" fill="${shade(t,.95)}"/><circle r="${R*0.2}" fill="${shade(t,.4)}"/>`;
  },
  auth(g,x,y,w,d,h,t){ // a padlock
    const bw=w*0.52,bd=d*0.42,bx=x+w*0.2,by=y+d*0.3,bh=h*0.52;
    const cxm=bx+bw/2;
    // shackle behind the body
    const [lx,ly]=P(cxm-bw*0.28,by+bd*0.5,bh),[rx2,ry2]=P(cxm+bw*0.28,by+bd*0.5,bh);
    const arc=bw*0.5;
    for(const [sw,col] of [[10,shade(t,.5)],[4,shade(t,1.1)]])
      g.append(svgel('path',{d:`M${lx} ${ly} L${lx} ${ly-arc*0.5} A${arc*0.62} ${arc*0.62} 0 0 1 ${rx2} ${ry2-arc*0.5} L${rx2} ${ry2}`,
        fill:'none',stroke:col,'stroke-width':sw,'stroke-linecap':'round'}));
    boxIn(g,bx,by,bw,bd,0,bh,t,{});
    const fS=faceG(g,'south',cxm,by+bd,bh*0.42);
    fS.innerHTML=`<circle r="${bw*0.11}" fill="#0B1322"/><path d="M0 0 L${-bw*0.05} ${bw*0.22} L${bw*0.05} ${bw*0.22} Z" fill="#0B1322"/>`;
  },
  projects(g,x,y,w,d,h,t){ // a kanban board on feet
    const bw=w*0.92,bx=x+w*0.04,by=y+d*0.55,bh=h*0.82;
    boxIn(g,bx+bw*0.08,by+2,10,8,0,14,t,{F:{l:.4,r:.6,t:.9,s:1.1}});
    boxIn(g,bx+bw*0.82,by+2,10,8,0,14,t,{F:{l:.4,r:.6,t:.9,s:1.1}});
    boxIn(g,bx,by,bw,9,12,bh,t,{});
    const fS=faceG(g,'south',bx+bw/2,by+9,12);
    const colw=bw*0.24,cards=[3,2,4];

/* ---------- edges (screen-space beziers) + particle system ---------- */
const KIND_COLOR={reads:'var(--reads)',writes:'var(--writes)',calls:'var(--calls)',ext:'var(--ext)',entry:'#2E3D56'};
const KIND_RGB={reads:'78,158,232',writes:'232,147,63',calls:'167,139,250',ext:'62,207,165',entry:'70,90,120'};
const edgeList=[]; // {a,b,cp, kind, sys, table, count, el}
function addEdge(fromId,toId,kind,sys,table,count){
  const a=nodePos[fromId],b=nodePos[toId]; if(!a||!b)return;
  const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2;
  const dx=b[0]-a[0], dy=b[1]-a[1], len=Math.hypot(dx,dy)||1;
  const cp=[mx-dy/len*len*0.12, my+dx/len*len*0.12];
  const d=`M${a[0]} ${a[1]} Q ${cp[0]} ${cp[1]}, ${b[0]} ${b[1]}`;
  const p=svgel('path',{d,class:'edgep',stroke:KIND_COLOR[kind]||'#3A4B66',
    'stroke-width':Math.min(2.6,.9+Math.log2(1+count)*.5)});
  p.dataset.sys=sys||'';p.dataset.table=table||'';p.dataset.kind=kind;
  gEdges.append(p);
  edgeList.push({a,b,cp,kind,sys,table,count,el:p});
}
/* aggregate system->domain and system->rpc from systemEdges */
{
  const agg={};
  for(const e of M.systemEdges){
    if(e.kind==='reads'||e.kind==='writes'){
      const tb=M.tables.find(t=>t.id===e.to); if(!tb)continue;
      const k=e.from+'|grp:'+tb.group+'|'+e.kind;
      agg[k]=agg[k]||{from:'sys:'+e.from,to:'grp:'+tb.group,kind:e.kind,sys:e.from,table:'grp:'+tb.group,count:0};
      agg[k].count+=e.count;
    }else if(e.kind==='calls'){
      const k=e.from+'|rpc';
      agg[k]=agg[k]||{from:'sys:'+e.from,to:'rpcbadge',kind:'calls',sys:e.from,table:'rpcbadge',count:0};
      agg[k].count+=e.count;
    }
  }
  for(const e of Object.values(agg))addEdge(e.from,e.to,e.kind,e.sys,e.table,e.count);
  // entry
  addEdge('entry:client','sys:invoicing','entry','invoicing',null,3);
  addEdge('entry:cron','sys:invoicing','entry','invoicing',null,3);
  for(const s of M.systems)if(s.counts.pages>0&&s.id!=='platform')addEdge('entry:team','sys:'+s.id,'entry',s.id,null,1);
  // external
  addEdge('sys:invoicing','ext:www.bankofcanada.ca','ext','invoicing',null,2);
  addEdge('sys:invoicing','ext:api.resend.com','ext','invoicing',null,2);
}

/* particles */
const parts=[];
function seedParticles(){
  parts.length=0;
  for(const e of edgeList){
    if(e.kind==='entry')continue;
    // ONE projectile per edge pair, never more in flight; heavier edges fire faster
    parts.push({e,t:Math.random(),v:0.0014+Math.min(0.0022,Math.log2(1+e.count)*0.0006)});
  }
}
seedParticles();
const q=(a,c,b,t)=>[(1-t)*(1-t)*a[0]+2*(1-t)*t*c[0]+t*t*b[0],(1-t)*(1-t)*a[1]+2*(1-t)*t*c[1]+t*t*b[1]];
let focusSys=null, journeyOn=false, jr=null;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tick(){
  ctx.clearRect(0,0,fx.width,fx.height);
  if(!reduced)for(const p of parts){
    p.t+=p.v; if(p.t>1)p.t=0;
    const dimmed=(focusSys&&p.e.sys!==focusSys)||journeyOn;
    if(dimmed)continue;
    const dir=t=>p.e.kind==='reads'?1-t:t; // reads flow toward system
    for(let k=2;k>=0;k--){ // short fading tail behind each mote
      const tt=p.t-k*0.018; if(tt<0)continue;
      const [x,y]=q(p.e.a,p.e.cp,p.e.b,dir(tt));
      ctx.beginPath();ctx.arc(x,y,k?1.3:2.3,0,7);
      ctx.fillStyle=`rgba(${KIND_RGB[p.e.kind]},${k?0.18:0.95})`;
      if(!k){ctx.shadowColor=`rgba(${KIND_RGB[p.e.kind]},.9)`;ctx.shadowBlur=7}
      ctx.fill();ctx.shadowBlur=0;
    }
  }
  if(journeyOn&&jr&&!reduced){
    jr.t=(jr.t+0.004)%1;
    const seg=Math.floor(jr.t*jr.segs.length), lt=(jr.t*jr.segs.length)%1;
    const s=jr.segs[seg]; if(s){
      const [x,y]=q(s.a,s.cp,s.b,lt);
      ctx.beginPath();ctx.arc(x,y,4.4,0,7);
      ctx.fillStyle='rgba(196,226,255,1)';ctx.shadowColor='rgba(127,192,255,1)';ctx.shadowBlur=14;ctx.fill();ctx.shadowBlur=0;
    }
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ---------- selection & panel (data logic) ---------- */

function clearMap(){

function fileRow(f){

function render(){

      <dt>SECURITY DEFINER function</dt><dd>A Postgres function that runs with elevated rights on the caller's behalf — how the public invoice page reads exactly one invoice without any table access.</dd>

}

  document.querySelectorAll('.edgep').forEach(p=>{if(p.dataset.sys===s.id){p.classList.add('lit');

    ${actions.length?`<h3>Server actions · ${actions.length}</h3><div class="filelist">${actions.map(f=>fileRow({id:f.id,meta:f.loc+' loc'})).join('')}</div>`:''}
    ${clients.length?`<h3>Client components · ${clients.length}</h3><div class="filelist">${clients.slice(0,20).map(f=>fileRow({id:f.id})).join('')}${clients.length>20?`<span class="citen" style="padding:4px 6px">+ ${clients.length-20} more</span>`:''}</div>`:''}
    ${libs.length?`<h3>Server modules · ${libs.length}</h3><div class="filelist">${libs.slice(0,20).map(f=>fileRow({id:f.id})).join('')}${libs.length>20?`<span class="citen" style="padding:4px 6px">+ ${libs.length-20} more</span>`:''}</div>`:''}`;
  panel.querySelectorAll('.chips button').forEach(b=>

function renderDomain(gid){
  const list=tableGroups[gid]; const s=sysById[gid];
  markSel('grp:'+gid);
  iso.classList.add('focused');
  document.querySelectorAll('.edgep').forEach(p=>{if(p.dataset.table==='grp:'+gid){p.classList.add('lit');

function renderTable(t){
  if(!t)return renderAbout();
  markSel('grp:'+t.group);
  iso.classList.add('focused');
  document.querySelectorAll('.edgep').forEach(p=>{if(p.dataset.table==='grp:'+t.group){p.classList.add('lit');
    const g=document.querySelector(`.bld[data-id="sys:${CSS.escape(p.dataset.sys)}"]`);g?.classList.remove('dim')}});

    ${t.readers.length?`<h3>Read by · ${t.readers.length}</h3><div class="filelist">${t.readers.map(f=>fileRow({id:f,meta:sysOf(f)})).join('')}</div>`:''}`;

function renderRpcs(){
  markSel('rpcbadge');
  panel.innerHTML=`
    <button class="backbtn" onclick="back()">&larr; Back to map</button>
    <div class="kicker">Database</div>
    <h2>Postgres functions</h2>
    <p>${M.rpcs.length} functions defined in migrations. The ones called from app code run as <b>SECURITY DEFINER</b> RPCs — the pattern Blue Board uses when a page needs more than its row-level security would allow (public invoice tokens, cross-user rollups).</p>
    <div class="filelist">${M.rpcs.map(r=>`<a href="${ghCite(r.citation)}" target="_blank" rel="noopener"><span>${esc(r.name)}</span></a>`).join('')}</div>`;
}
function hopAnchor(node){
  if(nodePos[node])return nodePos[node];
  const sys=M.systems.find(s=>s.files.some(f=>f.id===node));
  return sys?nodePos['sys:'+sys.id]:null;
}
function hopBld(node){
  if(node.startsWith('cron:'))return document.querySelector('.bld[data-id="entry:cron"]');
  if(node.startsWith('table:')){const t=M.tables.find(x=>x.id===node);return t?document.querySelector(`.bld[data-id="grp:${CSS.escape(t.group)}"]`):null}
  if(node.startsWith('rpc:'))return document.querySelector('.bld[data-id="rpcbadge"]');
  const sys=M.systems.find(s=>s.files.some(f=>f.id===node));
  return sys?document.querySelector(`.bld[data-id="sys:${CSS.escape(sys.id)}"]`):null;
}
function renderJourney(){
  const j=M.journeys.find(x=>x.id===state.id);
  const step=state.step??0;
  journeyOn=true; iso.classList.add('journeying');
  document.querySelectorAll(`#pathbar .jchip[data-j="${j.id}"]`).forEach(c=>c.classList.add('on'));
  document.querySelectorAll('.bld').forEach(b=>b.classList.add('dim'));
  document.querySelectorAll('.blabel').forEach(b=>b.classList.add('dim'));
  j.hops.forEach((h,i)=>{
    const g=hopBld(h.node);
    if(g){g.classList.remove('dim');if(i===step)g.classList.add('spot');
      const L=document.querySelector(`.blabel[data-id="${CSS.escape(g.dataset.id)}"]`);L?.classList.remove('dim')}
  });
  // glowing route + moving pulse
  const pts=j.hops.map(h=>hopAnchor(h.node)).filter(Boolean);
  const segs=[];
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i],b=pts[i+1];
    if(a[0]===b[0]&&a[1]===b[1])continue;
    const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;
    const dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy)||1;
    segs.push({a,b,cp:[mx-dy/len*len*0.10,my+dx/len*len*0.10]});
  }
  jr={segs,t:0};
  $('#jroute')?.remove();
  const d=segs.map(s=>`M${s.a[0]} ${s.a[1]} Q ${s.cp[0]} ${s.cp[1]}, ${s.b[0]} ${s.b[1]}`).join(' ');
  gEdges.append(svgel('path',{id:'jroute',d}));
  panel.innerHTML=`
    <button class="backbtn" onclick="back()">&larr; Back to map</button>
    <div class="kicker">Journey</div>
    <h2>${esc(j.name)}</h2>
    <p>${esc(j.summary)}</p>
    <div class="steps">${j.hops.map((h,i)=>`
      <div class="step ${i===step?'cur':''}" data-i="${i}" role="button" tabindex="0">
        <div class="n">${i+1}</div>
        <div class="b"><div class="f">${esc(h.node.replace('src/',''))}</div><div class="l">${esc(h.label)}</div></div>
      </div>`).join('')}
    </div>
    <div class="jnav">
      <button id="jprev" ${step===0?'disabled':''}>&larr; Prev</button>
      <button id="jnext" ${step===j.hops.length-1?'disabled':''}>Next &rarr;</button>
    </div>`;
  panel.querySelectorAll('.step').forEach(s=>{
    const go=()=>select({type:'journey',id:j.id,step:+s.dataset.i});
    s.addEventListener('click',go);
    s.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
  });
  $('#jprev').addEventListener('click',()=>select({type:'journey',id:j.id,step:step-1}));
  $('#jnext').addEventListener('click',()=>select({type:'journey',id:j.id,step:step+1}));
}

/* ---------- path bar ---------- */
{

/* ---------- pan & zoom ---------- */
const stage=$('#stage'),world=$('#world');
const WW=2400,WH=1700;
let vx=0,vy=0,vs=1;
function apply(){world.style.transform=`translate(${vx}px,${vy}px) scale(${vs})`}
function fit(){
  const r=stage.getBoundingClientRect();
  const bb=gBld.getBBox(); // fit to the built city, not the raw canvas
  const m=70;
  vs=Math.min((r.width-2*m)/bb.width,(r.height-120)/bb.height,1.2);
  vx=(r.width-bb.width*vs)/2-bb.x*vs;
  vy=(r.height-bb.height*vs)/2-bb.y*vs+16;
  apply();
}
fit(); addEventListener('resize',fit);
$('#zin').addEventListener('click',()=>{vs=Math.min(2.5,vs*1.25);apply()});
$('#zout').addEventListener('click',()=>{vs=Math.max(.25,vs/1.25);apply()});
$('#zfit').addEventListener('click',fit);
stage.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=stage.getBoundingClientRect();
  const mx=e.clientX-r.left,my=e.clientY-r.top;
  const k=e.deltaY<0?1.12:1/1.12; const ns=Math.min(2.5,Math.max(.25,vs*k));
  vx=mx-(mx-vx)*(ns/vs); vy=my-(my-vy)*(ns/vs); vs=ns; apply();
},{passive:false});
let pan=null;
stage.addEventListener('pointerdown',e=>{
  if(e.target.closest('.bld')||e.target.closest('.blabel'))return;
  pan={x:e.clientX-vx,y:e.clientY-vy};stage.classList.add('panning');stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove',e=>{if(pan){vx=e.clientX-pan.x;vy=e.clientY-pan.y;apply()}});
stage.addEventListener('pointerup',()=>{pan=null;stage.classList.remove('panning')});
stage.addEventListener('click',e=>{
  if(!e.target.closest('.bld')&&!e.target.closest('.blabel')&&state.type!=='about')select({type:'about'});
});

render();
